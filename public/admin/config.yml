backend:
  name: git-gateway
  branch: latest

media_folder: "public/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "blog"
    label: "Статьи"
    folder: "src/pages/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "publishDate", widget: "datetime" }
      - { label: "Текст", name: "body", widget: "markdown" }
